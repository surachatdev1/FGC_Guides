name: Temporary ASR Helper

on:
  push:
    branches:
      - tmp/asr-helper-20260728
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare-local-asr:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Build whisper.cpp CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build /tmp/whisper.cpp/build --config Release -j2
          mkdir -p local-asr
          cp /tmp/whisper.cpp/build/bin/whisper-cli local-asr/whisper-cli
          ldd local-asr/whisper-cli || true

      - name: Download multilingual tiny model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin \
            -o local-asr/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  local-asr/ggml-tiny.bin" | sha256sum -c -
          chmod +x local-asr/whisper-cli
          ls -lh local-asr

      - name: Upload local ASR bundle
        uses: actions/upload-artifact@v4
        with:
          name: temporary-local-asr-linux-static
          path: local-asr/
          retention-days: 1
          if-no-files-found: error
