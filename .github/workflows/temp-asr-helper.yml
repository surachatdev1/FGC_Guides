name: Temporary ASR Helper

on:
  push:
    branches:
      - tmp/asr-helper-20260728
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare-local-asr:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Download multilingual base model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-asr
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin \
            -o local-asr/ggml-base.bin
          echo "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  local-asr/ggml-base.bin" | sha256sum -c -
          ls -lh local-asr

      - name: Upload local ASR base model
        uses: actions/upload-artifact@v4
        with:
          name: temporary-local-asr-base-model
          path: local-asr/
          retention-days: 1
          if-no-files-found: error
