name: Temporary ASR Helper

on:
  push:
    branches:
      - tmp/asr-helper-20260728
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare-local-asr:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Download Silero VAD model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-asr
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin \
            -o local-asr/ggml-silero-v6.2.0.bin
          echo "2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987  local-asr/ggml-silero-v6.2.0.bin" | sha256sum -c -
          ls -lh local-asr

      - name: Upload VAD model
        uses: actions/upload-artifact@v4
        with:
          name: temporary-local-asr-vad
          path: local-asr/
          retention-days: 1
          if-no-files-found: error
