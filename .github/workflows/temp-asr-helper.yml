name: Temporary ASR Helper

on:
  push:
    branches:
      - tmp/asr-helper-20260728
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare-local-asr:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Download multilingual small quantized model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-asr
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin \
            -o local-asr/ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  local-asr/ggml-small-q5_1.bin" | sha256sum -c -
          ls -lh local-asr

      - name: Upload local ASR small model
        uses: actions/upload-artifact@v4
        with:
          name: temporary-local-asr-small-q5-model
          path: local-asr/
          retention-days: 1
          if-no-files-found: error
