name: Temporary ASR Helper

on:
  push:
    branches:
      - tmp/asr-helper-20260728
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare-local-asr:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Download multilingual large-v3-turbo quantized model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-asr
          curl -L --fail --retry 5 --retry-delay 5 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin \
            -o local-asr/ggml-large-v3-turbo-q5_0.bin
          echo "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  local-asr/ggml-large-v3-turbo-q5_0.bin" | sha256sum -c -
          ls -lh local-asr

      - name: Upload local ASR turbo model
        uses: actions/upload-artifact@v4
        with:
          name: temporary-local-asr-large-v3-turbo-q5
          path: local-asr/
          retention-days: 1
          if-no-files-found: error
